{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        .navbar{
    
    display:inline-flex;
    align-items:center;
    width:fit-content;
    position:relative;
    left: 25%;
    box-shadow:inset; 
}
.course-heading{
    background:#F8FAFC;
    
}
.nav-link:hover{
color:#FACC15 !important;
}
        /* ===========================
   ENQUIRY FORM
=========================== */

.enquiry-card{
    background:#18181B;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.enquiry-title{
    color:#fff;
    font-size:28px;
    font-weight:700;
    margin-bottom:25px;
}

.enquiry-title i{
    color:#8B5CF6;
}

/* Labels */

.form-label{
    color:#D1D5DB;
    font-weight:600;
    margin-bottom:8px;
}

/* Inputs */

.form-control,
.form-select{
    background:#27272A;
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    border-radius:12px;
    padding:12px 15px;
    transition:.3s;
}

.form-control::placeholder{
    color:#9CA3AF;
}

.form-control:focus,
.form-select:focus{
    background:#27272A;
    color:#fff;
    border-color:#8B5CF6;
    box-shadow:0 0 15px rgba(139,92,246,.25);
}

textarea.form-control{
    resize:none;
    min-height:140px;
}

/* Buttons */

.btn-submit{
    background:linear-gradient(135deg,#6D28D9,#8B5CF6);
    color:#fff;
    border:none;
    padding:12px 30px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn-submit:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(109,40,217,.35);
    color:#fff;
}

.btn-reset{
    background:#27272A;
    color:#fff;
    border:none;
    padding:12px 30px;
    border-radius:12px;
    margin-left:10px;
    transition:.3s;
}

.btn-reset:hover{
    background:#374151;
    color:#fff;
}

/* Card Header */

.card-header{
    background:linear-gradient(135deg,#6D28D9,#8B5CF6);
    border:none;
    border-radius:18px 18px 0 0 !important;
    padding:18px 25px;
}

.card-header h3{
    margin:0;
    color:#fff;
    font-weight:600;
}

/* Card Body */

.card-body{
    background:#18181B;
    border-radius:0 0 18px 18px;
}

/* Responsive */

@media(max-width:768px){

    .enquiry-card{
        padding:20px;
    }

    .btn-submit,
    .btn-reset{
        width:100%;
        margin-top:10px;
        margin-left:0;
    }

}
.login-btn{
    display:flex;
    align-items:center;
    gap:8px;

    padding:10px 24px;

    background:linear-gradient(135deg,#1E90FF,#00BFFF);

    color:#fff;
    text-decoration:none;

    font-size:16px;
    font-weight:600;

    border-radius:30px;

    transition:.35s ease;

    box-shadow:0 8px 20px rgba(30,144,255,.35);
}

.login-btn:hover{

    color:#fff;

    transform:translateY(-3px);

    box-shadow:0 15px 35px rgba(30,144,255,.55);

    background:linear-gradient(135deg,#2563EB,#38BDF8);
}

.login-btn i{
    font-size:15px;
}
    </style>
</head>
<body>
     <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid ml-5 "
                style="background-color:#0F172A; border-radius: 15px; ">
                <img src="{% static 'images/SipherWebLogo-CzTrOqHm.png' %}"
                    alt="Logo" width="80" height="50"
                    class="d-inline-block align-text-top">
                <a class="navbar-brand" style="color:darkblue;" href="#">Sipher
                    Web Academy</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse "
                    id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto p-3 mb-2 mb-lg-0 gap-5">
                        <li class="nav-item">
                            <a class="nav-link active " style="font-weight: bold; color:#F8FAFC; font-style: italic;"
                                aria-current="page" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;" href="#">About</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;"  href="#">Courses</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;"href="{% url 'enquiry' %}">Enquiry</a>
                            <li>
                                <div class="d-flex ms-auto">
    <a href="{% url 'admin_login' %}" class="login-btn">
        <i class="fa-solid fa-right-to-bracket"></i>
        Login
    </a>
</div>
                            </li>
                        </form>
                    </div>
                </div>
            </nav>
    
<div class="container-fluid py-4">

    <div class="card shadow-lg border-0">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">
                <i class="fa-solid fa-circle-question me-2"></i>
                Student Enquiry Form
            </h3>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="row">

                    <!-- Name -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text"
                               name="name"
                               class="form-control"
                               placeholder="Enter Student Name"
                               required>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Enter Email"
                               required>
                    </div>

                    <!-- Mobile -->
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mobile Number</label>
                        <input type="text"
                               name="mobile"
                               class="form-control"
                               placeholder="Enter Mobile Number"
                               required>
                    </div>

                    <!-- Course -->
                   <div class="col-md-6 mb-3">
    <label class="form-label" for="courseSelect">Course</label>

   <select name="course" id="courseSelect" class="form-select" required>
    <option value="" disabled selected>Select Course</option>

    {% for course in courses %}
        <option value="{{ course.coursename }}">
            {{ course.coursename }}
        </option>
    {% endfor %}
</select>
</div>

                    <!-- Message -->
                    <div class="col-12 mb-3">
                        <label class="form-label">Message</label>

                        <textarea name="message"
                                  rows="5"
                                  class="form-control"
                                  placeholder="Write your enquiry here..."
                                  required></textarea>
                    </div>

                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-primary px-4">
                        <i class="fa-solid fa-paper-plane me-2"></i>
                        Submit Enquiry
                    </button>

                    <button type="reset" class="btn btn-secondary px-4">
                        <i class="fa-solid fa-rotate-left me-2"></i>
                        Reset
                    </button>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
