{% extends 'admin_layout.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
        <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <style>
body{
    background:#0F172A;
}

/* Container */
.course-wrapper{
    max-width:720px;
    margin:40px auto;
}
/* Card */

.course-card{
    background:#1A1F2E;
    border:1px solid rgba(255,255,255,.06);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

/* Header */

.course-header{
    padding:28px 32px;
    background:linear-gradient(135deg,#2563EB,#4F46E5);
}

.course-header h3{
    color:#fff;
    margin:0;
    font-size:28px;
    font-weight:700;
}

.course-header p{
    color:rgba(255,255,255,.85);
    margin:8px 0 0;
    font-size:14px;
}

/* Body */

.course-body{
    padding:32px;
}

/* Labels */

.form-label{
    color:#E2E8F0;
    font-weight:600;
    margin-bottom:8px;
}

/* Inputs */

.form-control{
    background:#242B3D;
    border:1px solid rgba(255,255,255,.08);
    color:#fff;
    border-radius:14px;
    padding:13px 15px;
    transition:.3s;
}

.form-control::placeholder{
    color:#94A3B8;
}

.form-control:focus{
    background:#242B3D;
    color:#fff;
    border-color:#2563EB;
    box-shadow:0 0 0 4px rgba(37,99,235,.15);
}

/* File Upload */

input[type=file]{
    padding:10px;
}

/* Button */

.btn-save{
    width:100%;
    border:none;
    border-radius:14px;
    padding:14px;
    background:linear-gradient(135deg,#2563EB,#4F46E5);
    color:#fff;
    font-weight:600;
    font-size:16px;
    transition:.3s;
}

.btn-save:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 30px rgba(37,99,235,.3);
}

/* Divider */

.form-section{
    margin-bottom:22px;
}

/* Responsive */

@media(max-width:768px){

.course-body{
    padding:22px;
}

.course-header{
    padding:22px;
}

.course-header h3{
    font-size:24px;
}

}
input[type="file"]{
    background:#2A3042;
    color:#CBD5E1;
    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;
}

input[type="file"]::file-selector-button{

    background:#2563EB;   /* Change this color */

    color:#fff;

    border:none;

    padding:12px 20px;

    margin-right:18px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;
}

input[type="file"]::file-selector-button:hover{

    background:#1D4ED8;   /* Hover color */

}
    </style>
    </head>
    <body>
        <form method="POST">
          <div class="course-wrapper">

<div class="course-card">
                  <div class="course-header">

<h3>
<i class="fa-solid fa-book-open me-2"></i>
Add New Course
</h3>

<p>
Create a new course by filling in the information below.
</p>

</div>
                    </div>

                   <div class="course-body">
                        <form method="POST"  action="{% url 'add_courses' %}"
      enctype="multipart/form-data">
                            {% csrf_token %}

                     <div class="form-section">
                                <label class="form-label text-light"><i class="fa-solid fa-book me-2"></i>Course Name</label>
                                     <input type="text" name="course" id="" placeholder="Enter Course Name" class="form-control">


                               
                            </div>
                           
                        <div class="form-section">
                                <label class="form-label text-light"><i class="fa-solid fa-calendar-days me-2"></i>Session</label>
                                <input type="text" name="session"
                                    class="form-control"
                                    placeholder="e.g. 2026-2027">
                            </div>

                  <div class="form-section">
                                <label class="form-label text-light"><i class="fa-solid fa-clock me-2"></i>Duration</label>
                                <input type="text" name="duration"
                                    class="form-control"
                                    placeholder="e.g. 6 Months">
                            </div>
<div class="form-section">
                                <label class="form-label text-light"><i class="fa-solid fa-indian-rupee-sign me-2"></i>Fees</label>
                                <input type="number" name="fees"
                                    class="form-control"
                                    placeholder="Enter Course Fees">
                            </div>
                            <div class="col-md-6 mb-3">

    <label class="form-label text-light"><i class="fa-solid fa-image me-2"></i>

        Course Image

    </label>

    <input
        type="file"
        name="course_image"
        class="form-control"
        accept="image/*">

</div>
<button type="submit" class="btn-save">

<i class="fa-solid fa-floppy-disk me-2"></i>

Save Course

</button>
                        </form>
                    </div>
                </div>
            </div>
        </form>
        {% endblock %}
    </body>
</html>
