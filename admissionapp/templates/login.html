
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipher Web Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
 /* ==========================
        GOOGLE FONT
========================== */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{

    min-height:100vh;

    background:#0F172A;

    background-image:

        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),

        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px),

        radial-gradient(circle at top right,#10B98122,transparent 35%),

        radial-gradient(circle at bottom left,#22C55E22,transparent 35%);

    background-size:
        40px 40px,
        40px 40px,
        auto,
        auto;

}
/* ==========================
        PAGE
========================== */

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

/* ==========================
        CARD
========================== */

.login-card{

    width:100%;
    max-width:430px;

    background:#1E293B;

    border:1px solid #334155;

    border-radius:20px;

    padding:45px;

    box-shadow:0 20px 50px rgba(0,0,0,.35);

    text-align:center;

}

/* ==========================
        LOGO
========================== */

.logo{

    width:90px;

    margin-bottom:20px;

}

.login-card h2{

    color:#fff;

    font-size:32px;

    font-weight:700;

    margin-bottom:8px;

}

.subtitle{

    color:#94A3B8;

    font-size:15px;

    margin-bottom:35px;

}

/* ==========================
        FORM
========================== */

.form-group{

    text-align:left;

    margin-bottom:22px;

}

.form-group label{

    display:block;

    margin-bottom:8px;

    color:#CBD5E1;

    font-size:14px;

    font-weight:500;

}

.input-box{

    display:flex;

    align-items:center;

    background:#0F172A;

    border:1px solid #334155;

    border-radius:12px;

    overflow:hidden;

    transition:.3s;

}

.input-box:focus-within{

    border-color:#2563EB;

    box-shadow:0 0 0 4px rgba(37,99,235,.15);

}

.input-box i{

    width:55px;

    text-align:center;

    color:#64748B;

}

.input-box input{

    flex:1;

    border:none;

    outline:none;

    background:none;

    color:#fff;

    height:54px;

    font-size:15px;

}

.input-box input::placeholder{

    color:#64748B;

}

#togglePassword{

    width:55px;

    border:none;

    background:none;

    color:#94A3B8;

    cursor:pointer;

}

/* ==========================
        BUTTON
========================== */

.login-btn{

    width:100%;

    height:54px;

    border:none;

    border-radius:12px;

    margin-top:10px;

    background:#2563EB;

    color:#fff;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.login-btn:hover{

    background:#1D4ED8;

    transform:translateY(-2px);

}

/* ==========================
        FOOTER
========================== */

.footer{

    margin-top:30px;

    color:#64748B;

    font-size:13px;

    line-height:1.8;

}

/* ==========================
        MOBILE
========================== */

@media(max-width:500px){

.login-card{

    padding:30px 22px;

}

.login-card h2{

    font-size:26px;

}

.logo{

    width:75px;

}

}
</style>
</head>

<body>
    
 {% load static %}

<div class="login-page">

    <div class="login-card">

        <img src="{% static 'images/SipherWebLogo-CzTrOqHm.png' %}"
             class="logo"
             alt="Logo">

        <h2>Admin Login</h2>

        <p class="subtitle">
            Sign in to your administrator account
        </p>

        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Username</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required>

                </div>

            </div>

            <div class="form-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                    <button
                        type="button"
                        id="togglePassword">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <button class="login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <div class="footer">

            Secure Administration Portal

            <br>

            © 2026 Sipher Web Academy

        </div>

    </div>

</div>

<script>

const togglePassword=document.getElementById("togglePassword");

const password=document.getElementById("password");

togglePassword.onclick=function(){

if(password.type==="password"){

password.type="text";

togglePassword.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}

else{

password.type="password";

togglePassword.innerHTML='<i class="fa-solid fa-eye"></i>';

}

}

</script>

</body>
</html>
