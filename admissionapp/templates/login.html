
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sipher Web Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:url("{% static 'images/login image.jpg' %}");

    background-size:cover;

    background-position:center;

    overflow:hidden;

}

body::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(87, 112, 88, 0.45);

}

.login-container{

    position:relative;

    z-index:5;

}

.login-card{

    width:380px;

    padding:40px;

    border-radius:25px;

  background: rgba(255, 255, 255, 0.15); /* Transparent white */
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px); /* Safari support */

    border: 1px solid rgba(255,255,255,0.2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);

}

.login-card h2{

    color:#fff;

    text-align:center;

    margin-bottom:35px;

    font-weight:700;

    letter-spacing:1px;

}

.form-control{

    height:50px;

    border:none;

    border-radius:50px;

    background:rgba(255,255,255,.15);

    color:white;

    padding-left:20px;

}

.form-control::placeholder{

    color:#ddd;

}

.form-control:focus{

    background:rgba(255,255,255,.22);

    color:white;

    box-shadow:none;

}

.input-group-text{

    background:rgba(255,255,255,.15);

    border:none;

    color:white;

    cursor:pointer;

    border-radius:0 50px 50px 0;

}

.form-check-label{

    color:white;

}

.forgot{

    color:white;

    text-decoration:none;

}

.forgot:hover{

    color:#ffc107;

}

.login-btn{

    width:100%;

    height:50px;

    border:none;

    border-radius:50px;

    background:linear-gradient(135deg,#007BFF,#00C6FF);

    color:white;

    font-size:18px;

    font-weight:700;

    transition:.4s;

}

.login-btn:hover{

    transform:translateY(-4px);

    box-shadow:0 15px 35px rgba(0,123,255,.5);

}

.register{

    text-align:center;

    color:white;

    margin-top:25px;

}

.register a{

    color:#ffc107;

    text-decoration:none;

    font-weight:600;

}
.navbar{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);

    width:75%;
    padding:12px 30px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-radius:20px;

    background:rgba(20,30,48,.45);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 15px 40px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.12);

    z-index:999;
    transition:.4s;
}

.navbar:hover{
    background:rgba(20,30,48,.60);
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}
</style>
</head>

<body>
    
     <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid ml-5 "
                style="background-color:#0F172A; border-radius: 15px; ">
                <img src="{% static 'images/SipherWebLogo-CzTrOqHm.png' %}"
                    alt="Logo" width="80" height="50"
                    class="d-inline-block align-text-top">
                <a class="navbar-brand" style="color:darkblue;" href="#">Sipher
                    Web Academy</a>
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse "
                    id="navbarSupportedContent">
                    <ul class="navbar-nav mx-auto p-3 mb-2 mb-lg-0 gap-5">
                        <li class="nav-item">
                            <a class="nav-link active " style="font-weight: bold; color:#F8FAFC; font-style: italic;"
                                aria-current="page" href="{% url 'home' %}">Home</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;" href="#">About</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;"  href="#">Courses</a>
                        </li>
                        <li class="nav-item" >
                            <a class="nav-link" style="font-weight: bold; color:#F8FAFC; font-style: italic;"href="{% url 'enquiry' %}">Enquiry</a>
                        </form>
                    </div>
                </div>
            </nav>

    <div class="login-container">

        <div class="login-card">
            

            <h2>Login</h2>
            {% if error %}
            <p style="color: red;">{{error}}</p>
            {% endif %}
            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <input type="text"
                        class="form-control"
                        name="username"
                        placeholder="Username">

                </div>

                <div class="mb-3">

                    <div class="input-group">

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            name="password"
                            placeholder="Password">

                        <span class="input-group-text" id="togglePassword">

                            <i class="fa-solid fa-eye"></i>

                        </span>

                    </div>

                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox">

                        <label class="form-check-label">

                            Remember Me

                        </label>

                    </div>

                    <a href="#" class="forgot">

                        Forgot Password?

                    </a>

                </div>

                <button type="submit" class="login-btn">

                    LOGIN

                </button>

                <div class="register">

                    Don't have an account?

                    <a href="#">Register</a>

                </div>

            </form>

        </div>

    </div>

<script>

const togglePassword=document.getElementById("togglePassword");

const password=document.getElementById("password");

togglePassword.onclick=function(){

if(password.type==="password"){

password.type="text";

togglePassword.innerHTML='<i class="fa-solid fa-eye-slash"></i>';

}

else{

password.type="password";

togglePassword.innerHTML='<i class="fa-solid fa-eye"></i>';

}

}

</script>

</body>
</html>
