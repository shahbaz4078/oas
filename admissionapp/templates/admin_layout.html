            <style>
                /* ── SIDEBAR ── */
.sidebar{
    width:220px;
    height:100vh;
    background:#111420;

    position:fixed;
    top:0;
    left:0;

    margin:0;
    padding:0;

    display:flex;
    flex-direction:column;

    border-right:1px solid rgba(255,255,255,.06);
    z-index:1000;
}
.sidebar::-webkit-scrollbar { display: none; }

/* ── PROFILE ── */
.sb-profile {
  padding: 16px 14px;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.sb-profile::after {
  content: '';
  position: absolute;
  right: -20px; top: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}
.sb-avatar {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  border: 2px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: #fff;
  flex-shrink: 0; position: relative; z-index: 1;
}
.sb-name { position: relative; z-index: 1; }
.sb-name strong { display: block; font-size: 13px; font-weight: 600; color: #fff; }
.sb-name span   { font-size: 10px; color: rgba(255,255,255,0.65); }

/* ── NAV ── */
.sb-nav { flex: 1; padding: 8px 0; }

.sb-group-label {
  font-size: 10px; font-weight: 600;
  color: rgba(255,255,255,0.25);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 14px 14px 5px;
}

.sb-link {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 14px;
  color: rgba(255,255,255,0.55);
  text-decoration: none;
  font-size: 12.5px; font-weight: 500;
  position: relative;
  transition: background .15s, color .15s;
}
.sb-link:hover {
  background: rgba(255,255,255,0.04);
  color: rgba(255,255,255,0.9);
}
.sb-link:hover .sb-icon { color: rgba(255,255,255,0.7); }
.sb-link:hover .sb-arrow { transform: translateX(3px); }

/* active state */
.sb-link.active {
  background: rgba(139,92,246,0.12);
  color: #fff;
}
.sb-link.active::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 3px;
  background: linear-gradient(180deg, #8b5cf6, #6d28d9);
  border-radius: 0 2px 2px 0;
}
.sb-link.active .sb-icon {
  background: rgba(139,92,246,0.2);
  color: #a78bfa;
}

/* icon box */
.sb-icon {
  width: 28px; height: 28px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
  color: rgba(255,255,255,0.3);
  transition: background .15s, color .15s, transform .15s;
}
.sb-link:hover .sb-icon { transform: scale(1.08); }

/* arrow */
.sb-arrow {
  font-size: 9px;
  color: rgba(255,255,255,0.2);
  margin-left: auto;
  transition: transform .15s, color .15s;
}
.sb-link.active .sb-arrow { color: rgba(255,255,255,0.4); }

/* divider */
.sb-divider {
  height: 1px;
  background: rgba(255,255,255,0.05);
  margin: 8px 14px;
}

/* ── FOOTER ── */
.sb-footer {
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.sb-footer-icon {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: rgba(250,204,21,0.1);
  border: 1px solid rgba(250,204,21,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: #facc15;
  flex-shrink: 0;
}
.sb-footer-text { flex: 1; }
.sb-footer-text strong {
  display: block;
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.7);
}
.sb-footer-text span {
  display: block;
  font-size: 10px; color: rgba(255,255,255,0.3);
  margin-bottom: 5px;
}
.sb-progress-wrap {
  background: rgba(255,255,255,0.06);
  border-radius: 10px; height: 4px; overflow: hidden;
}
.sb-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #2563eb, #8b5cf6);
  border-radius: 10px; width: 0;
  animation: progressLoad 1.5s ease 0.5s forwards;
}
@keyframes progressLoad { to { width: 68%; } }
/* Main Content */

.main-content{
    margin-left:220px;   /* Same as sidebar width */
    min-height:100vh;
    background:#0F172A;
    padding:25px;
}
/* Topbar */

.topbar{
    width:100%;
    background:#18181B;
    border-radius:20px;
    padding:18px 30px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
    margin-bottom:30px;
}
/* Search */

.search-box{
    width:300px;
    background:#27272A;
    border-radius:50px;
    padding:10px 18px;
    display:flex;
    align-items:center;
}

.search-box i{
    color:#9CA3AF;
    margin-right:10px;
}

.search-box input{
    width:100%;
    border:none;
    background:transparent;
    outline:none;
    color:white;
}

.search-box input::placeholder{
    color:#9CA3AF;
}

/* Icons */

.top-icon{
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#27272A;
    color:white;
    position:relative;
    transition:.3s;
}

.top-icon:hover{
    background:#6D28D9;
    transform:translateY(-3px);
}

/* Notification Dot */

.notify-dot{
    width:9px;
    height:9px;
    background:#FACC15;
    border-radius:50%;
    position:absolute;
    top:10px;
    right:12px;
}

/* Profile */

.admin-profile{
    display:flex;
    align-items:center;
    gap:12px;
    background:#27272A;
    padding:8px 15px;
    border-radius:50px;
}

.admin-profile img{
    width:45px;
    height:45px;
    border-radius:50%;
    object-fit:cover;
}

/* Responsive */

@media(max-width:992px){

.search-box{
    display:none;
}

.admin-profile h6,
.admin-profile small{
    display:none;
}

}
body{

/* Cards */

.dashboard-card{
    background:#18181B;
    border:1px solid rgba(255,255,255,.05);
    border-radius:18px;
    padding:24px;
    transition:.35s;
}

.dashboard-card:hover{
    transform:translateY(-6px);
    border-color:#6D28D9;
    box-shadow:0 0 30px rgba(109,40,217,.25);
}
/* Statistics */

.stat-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.stat-card h2{
    margin:10px 0;
    font-weight:700;
}

.stat-card small{
    color:#9CA3AF;
}

.stat-icon{
    width:65px;
    height:65px;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
}

.purple .stat-icon{
    background:rgba(109,40,217,.15);
    color:#8B5CF6;
}

.blue .stat-icon{
    background:rgba(37,99,235,.15);
    color:#3B82F6;
}

.orange .stat-icon{
    background:rgba(249,115,22,.15);
    color:#FB923C;
}

.green .stat-icon{
    background:rgba(22,163,74,.15);
    color:#4ADE80;
}

.table-dark{
    background:transparent;
}

.table-dark td,
.table-dark th{
    background:transparent;
    color:#ddd;
}

.btn-primary{
    background:#6D28D9;
    border:none;
}

.btn-primary:hover{
    background:#7C3AED;
}

.btn-warning{
    color:#fff;
}
      .form-container{

}

.form-control,
.form-select{

    padding:10px;

.form-control:focus,
.form-select:focus{
    box-shadow:none;
    border-color:#6D28D9;
}

    background:#6D28D9;
    border:none;
}

.btn-primary:hover{
    background:#7C3AED;
}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", function () {

    const currentPage = window.location.pathname;

    const links = document.querySelectorAll(".sb-link");

    links.forEach(link => {

        const linkPath = new URL(link.href).pathname;

        if (linkPath === currentPage) {
            link.classList.add("active");
        } else {
            link.classList.remove("active");
        }

    });

});
</script>
