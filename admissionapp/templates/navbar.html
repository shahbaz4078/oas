/* ── NAVBAR ── */
/* ── NAVBAR ── */
.navbar {
    width: min(92%, 1100px) !important;
    margin: 18px auto 0 !important;
    padding: 10px 18px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 16px !important;

    background: #0b1220 !important;
    border: 1px solid rgba(255, 255, 255, 0.06) !important;
    border-radius: 100px !important;

    box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.03) !important;

    position: relative !important;
    left: auto !important;
    right: auto !important;
}

.navbar .container {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 16px !important;
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    border-radius: 0 !important;
}

.navbar-brand {
    color: #e2e8f0 !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    margin: 0 !important;
    white-space: nowrap;
}

.navbar-nav {
    display: flex !important;
    align-items: center !important;
    gap: 28px !important;
    margin: 0 auto !important;
    padding: 0 !important;
}

.navbar .nav-link {
    color: rgba(255, 255, 255, 0.8) !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    font-style: normal !important;
    padding: 0 !important;
    transition: color 0.25s ease;
}

.navbar .nav-link:hover,
.navbar .nav-link.active {
    color: #FACC15 !important;
}

.login-btn {
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 8px !important;

    min-width: 110px;
    height: 42px;
    padding: 0 20px !important;

    background: linear-gradient(135deg, #2563EB, #3B82F6) !important;
    color: #fff !important;
    text-decoration: none !important;

    font-size: 14px !important;
    font-weight: 600 !important;

    border: none !important;
    border-radius: 50px !important;

    box-shadow:
        0 8px 24px rgba(37, 99, 235, 0.4),
        0 0 20px rgba(59, 130, 246, 0.25) !important;

    transition: transform 0.25s ease, box-shadow 0.25s ease !important;
    white-space: nowrap;
}

.login-btn:hover {
    color: #fff !important;
    transform: translateY(-2px) !important;
    box-shadow:
        0 14px 32px rgba(37, 99, 235, 0.5),
        0 0 28px rgba(59, 130, 246, 0.3) !important;
}

@media (max-width: 768px) {
    .navbar {
        width: 94% !important;
        border-radius: 18px !important;
        padding: 10px 14px !important;
    }

    .navbar-nav {
        gap: 16px !important;
        margin: 10px 0 0 !important;
        width: 100%;
        justify-content: center;
    }
}

/* ── SECTION TITLE ── */
.course-heading { background: #F8FAFC; }

.line {
  width: 90px;
  height: 5px;
  background: var(--c-yellow);
  margin: 25px auto 0;
  border-radius: 10px;
}

.dot {
  width: 8px;
  height: 8px;
  background: var(--c-blue);
  border-radius: 50%;
}

.title-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: bold;
  color: var(--c-blue);
}

.main-title {
  font-size: 73px;
  color: var(--c-dark);
  font-weight: bold;
}

.title-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}
.title-divider span {
  width: 50px;
  height: 2px;
  background: var(--c-yellow);
}
.title-divider i { color: var(--c-yellow); }

/* ── MODE CARDS ── */
.mode-card {
  background: var(--c-white);
  border-radius: 20px;
  padding: 28px 24px 0;
  box-shadow: 0 4px 28px rgba(0, 0, 0, .07);
  height: 100%;
  display: flex;
  flex-direction: column;
  transition: transform .25s, box-shadow .25s;
  overflow: hidden;
}
.mode-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 14px 48px rgba(0, 0, 0, .12);
}
.offline-card { border-bottom: 4px solid var(--c-yellow); }
.online-card  { border-bottom: 4px solid var(--c-blue); }

.icon-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-orange), var(--c-yellow));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  color: var(--c-white);
}
.icon-circle.blue {
  background: linear-gradient(135deg, var(--c-blue), var(--c-blue-light));
}

.orange-line,
.blue-line {
  width: 36px;
  height: 3px;
  border-radius: 2px;
  margin-top: 10px;
}
.orange-line { background: var(--c-orange); }
.blue-line   { background: var(--c-blue); }

.classroom-img { max-height: 180px; object-fit: cover; }
.online-image  { position: relative; display: inline-block; }
.laptop-img    { max-height: 180px; object-fit: contain; }
.wifi-icon {
  position: absolute;
  top: -10px;
  right: -10px;
  font-size: 28px;
  color: var(--c-blue);
  opacity: .75;
}

.feature-area,
.feature-box-online {
  margin: 24px -24px 0;
  padding: 16px 12px;
  border-radius: 0 0 16px 16px;
}
.feature-area       { background: #fff8f0; }
.feature-box-online { background: #f0f5ff; }
.feature-area p,
.feature-box-online p {
  font-size: 12px;
  font-weight: 600;
  color: #374151;
  margin: 0;
}

.feature-icon,
.feature-circle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--c-white);
  margin: 0 auto 8px;
}
.feature-icon   { background: linear-gradient(135deg, var(--c-orange), var(--c-yellow)); }
.feature-circle { background: linear-gradient(135deg, var(--c-blue), var(--c-blue-light)); }
</style>
