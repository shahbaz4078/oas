{% extends 'admin_layout.html' %}
{% block content %}
<head>
    <style>
        /* ===========================
        ADD STUDENT
=========================== */

.form-container{

    max-width:900px;

    margin:40px auto;

    background:#1A1F2E;

    border:1px solid rgba(255,255,255,.06);

    border-radius:22px;

    overflow:hidden;

    box-shadow:0 20px 45px rgba(0,0,0,.25);

}

/* Header */

.form-header{

    background:linear-gradient(135deg,#2563EB,#4F46E5);

    padding:28px 32px;

    display:flex;

    align-items:center;

    gap:18px;

}

.form-icon{

    width:60px;

    height:60px;

    border-radius:16px;

    background:rgba(255,255,255,.15);

    display:flex;

    justify-content:center;

    align-items:center;

    color:#fff;

    font-size:24px;

}

.form-header h2{

    margin:0;

    color:#fff;

    font-size:30px;

    font-weight:700;

}

.form-header p{

    margin:6px 0 0;

    color:rgba(255,255,255,.85);

    font-size:14px;

}

/* Body */

.form-body{

    padding:32px;

}

/* Labels */

.form-label{

    color:#E2E8F0;

    font-weight:600;

    margin-bottom:8px;

}

/* Inputs */

.form-control,
.form-select{

    background:#242B3D;

    border:1px solid rgba(255,255,255,.08);

    color:#fff;

    border-radius:14px;

    height:54px;

    transition:.3s;

}

textarea.form-control{

    height:130px;

    resize:none;

}

.form-control::placeholder{

    color:#94A3B8;

}

.form-control:focus,
.form-select:focus{

    background:#242B3D;

    color:#fff;

    border-color:#2563EB;

    box-shadow:0 0 0 4px rgba(37,99,235,.15);

}

/* Select */

.form-select option{

    background:#242B3D;

    color:#fff;

}

/* Buttons */

.form-buttons{

    display:flex;

    gap:15px;

    margin-top:10px;

}

.btn-save{

    flex:1;

    height:54px;

    border:none;

    border-radius:14px;

    background:linear-gradient(135deg,#2563EB,#4F46E5);

    color:#fff;

    font-weight:600;

    transition:.3s;

}

.btn-save:hover{

    transform:translateY(-2px);

    box-shadow:0 15px 30px rgba(37,99,235,.25);

}

.btn-reset{

    width:160px;

    height:54px;

    border:none;

    border-radius:14px;

    background:#2A3042;

    color:#E2E8F0;

    font-weight:600;

    transition:.3s;

}

.btn-reset:hover{

    background:#374151;

}

/* Mobile */

@media(max-width:768px){

.form-body{

    padding:22px;

}

.form-header{

    padding:22px;

}

.form-buttons{

    flex-direction:column;

}

.btn-reset{

    width:100%;

}

}
    </style>
</head>
<div class="form-container mt-4">

<div class="form-header">

    <div class="form-icon">
        <i class="fa-solid fa-user-plus"></i>
    </div>

    <div>

        <h2>Add New Student</h2>

        <p>
            Register a new student into the academy management system.
        </p>

    </div>

</div>

    <form method="POST" action="{% url 'add_student' %}">
{% csrf_token %}

<div class="form-body">


        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label text-light">Student Name</label>
                <input type="text" class="form-control" name="name">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label text-light">Email</label>
                <input type="email" class="form-control" name="email">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label text-light">Password</label>
                <input type="text" class="form-control" name="password">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label text-light">Mobile Number</label>
                <input type="text" class="form-control" name="mobile">
            </div>
            

            <div class="col-md-6 mb-3">
    <label class="form-label text-light">Course</label>
    <select name="course" class="form-select" required>
        <option value="">Select Course</option>

        {% for course in courses %}
            <option value="{{ course.id }}">
                {{ course.coursename }}
            </option>
        {% endfor %}
    </select>
</div>

                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Gender</label>
                    <select class="form-select" name="gender">
                        <option>Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Date of Joining</label>
                    <input type="date" class="form-control" name="dob">
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label text-light">Address</label>
                    <textarea class="form-control" rows="4"
                        name="address"></textarea>
                </div>

            </div>
</div>

          <div class="form-buttons">

    <button type="submit" class="btn-save">

        <i class="fa-solid fa-floppy-disk me-2"></i>

        Save Student

    </button>

    <button type="reset" class="btn-reset">

        <i class="fa-solid fa-rotate-left me-2"></i>

        Reset

    </button>

</div>
        </form>

    </div>
    </div>
</form>
    {% endblock %}
